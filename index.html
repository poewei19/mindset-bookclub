<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>《终身成长》读书会简明版</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0F6B5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="成长读书会">
<meta name="description" content="用小学五年级就能看懂的话，讲《终身成长》里最有用的想法。可以划线提问，把问题发给作者。">
<style>
/* Layout: one chapter per screen, sticky top bar, bottom bar appears when text is selected.
   No web fonts or CDNs: everything is in this file so it opens fine in China and inside WeChat. */
:root {
  --bg: #F3F5F2;
  --paper: #FFFFFF;
  --ink: #1E2823;
  --muted: #5B6A62;
  --line: #DCE3DE;
  --accent: #0F6B5E;
  --accent-soft: #E0EFEB;
  --mark: #FFE38A;
  --mark-on: #F5C842;
  --warn: #B4532A;
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", system-ui, sans-serif;
  --font-title: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121815; --paper: #1A221E; --ink: #E4ECE7; --muted: #9BADA3; --line: #2C3832;
    --accent: #6CC7B4; --accent-soft: #1F3530; --mark: #6A5A16; --mark-on: #8C7618; --warn: #E08A62;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.85 var(--font); }
button { font: inherit; color: inherit; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
header .wrap { display: flex; align-items: center; gap: 8px; padding-block: 10px; }
.brand { flex: 1; min-width: 0; font: 700 1rem/1.3 var(--font-title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-size: .9rem; cursor: pointer; white-space: nowrap; }
.tbtn b { color: var(--accent); }

main .wrap { padding-block: 20px 120px; }
article { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; }
.kicker { font-size: .85rem; color: var(--muted); margin: 0 0 4px; }
h1 { font: 700 1.55rem/1.4 var(--font-title); margin: 0 0 18px; }
h2.lbl { font-size: .9rem; font-weight: 700; color: var(--accent); margin: 22px 0 4px; letter-spacing: .05em; }
p { margin: 0 0 10px; }
.one { font: 700 1.2rem/1.7 var(--font-title); }
ul, ol { margin: 0 0 10px; padding-left: 1.4em; }
li { margin-bottom: 4px; }
.example { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; }
mark.hl { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; cursor: pointer; }
mark.hl.on { background: var(--mark-on); }

.task { display: flex; gap: 10px; align-items: flex-start; border: 1px dashed var(--line); border-radius: 10px; padding: 12px; cursor: pointer; }
.task input { width: 22px; height: 22px; margin-top: 5px; accent-color: var(--accent); flex-shrink: 0; }

.check { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 16px; }
.check p { color: var(--muted); font-size: .95rem; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 16px; cursor: pointer; font-size: .95rem; }
.choice[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.hint { font-size: .85rem; color: var(--muted); }

.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
.pbtn { flex: 1; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 12px; cursor: pointer; text-align: left; font-size: .95rem; min-width: 0; }
.pbtn.next { text-align: right; }
.pbtn small { display: block; color: var(--muted); font-size: .8rem; }
.pbtn[hidden] { visibility: hidden; display: block; }

.toc a { display: flex; justify-content: space-between; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
.toc a:last-child { border-bottom: 0; }
.toc .meta { color: var(--muted); font-size: .85rem; white-space: nowrap; }

/* Bottom bar: shows while text is selected, so phone users can ask about it. */
.selbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--ink); color: var(--paper); padding: 12px max(16px, env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px; justify-content: center; }
.selbar button { background: var(--mark); color: #1E2823; border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 700; cursor: pointer; }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 6; background: var(--accent); color: var(--paper); border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.18); cursor: pointer; }

.sheet-bg { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 680px; max-height: 88vh; overflow: auto; background: var(--paper); border-radius: 16px 16px 0 0; padding: 18px max(16px, env(safe-area-inset-left)) calc(18px + env(safe-area-inset-bottom)); }
.sheet h3 { margin: 0 0 8px; font: 700 1.15rem/1.4 var(--font-title); }
.quote { border-left: 3px solid var(--mark-on); padding-left: 10px; color: var(--muted); margin: 0 0 12px; font-size: .95rem; }
textarea, input[type="text"] { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 10px; font: inherit; font-size: 1rem; }
textarea { min-height: 96px; resize: vertical; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--paper); border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { background: transparent; border-color: var(--warn); color: var(--warn); }
.note { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.note .q { margin: 4px 0 0; }
.note a { color: var(--accent); font-size: .85rem; }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: .9rem; z-index: 20; }
button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.install { display: flex; gap: 10px; align-items: center; background: var(--accent-soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; font-size: .9rem; line-height: 1.6; }
.install span { flex: 1; }
.install button { border: 0; background: var(--accent); color: var(--paper); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
/* Tablets (iPad mini is 744px wide in portrait): a little larger text, roomier page, centered dialogs. */
@media (min-width: 700px) {
  body { font-size: 19px; }
  .wrap { max-width: 720px; }
  article { padding: 32px 36px; }
  h1 { font-size: 1.75rem; }
  .sheet-bg { align-items: center; }
  .sheet { border-radius: 16px; max-width: 600px; }
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">《终身成长》读书会简明版</div>
    <button class="tbtn" id="tocBtn">目录</button>
    <button class="tbtn" id="myBtn">我的问题 <b id="myCount">0</b></button>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>

<div class="selbar" id="selbar" hidden><span>选中了一段文字</span><button id="askBtn">对这段提问</button></div>
<button class="fab" id="fab">提个问题</button>
<div id="sheetRoot"></div>

<script>
// ---------- settings for whoever publishes this ----------
const CONFIG = {
  // Shown on the "我的问题" page so readers know where to send feedback.
  sendTo: "把复制好的内容发给分享这个链接给你的朋友（微信就可以）。",
  // Optional: a URL that accepts a JSON POST (for example a form service). Leave empty to use copy/share only.
  feedbackUrl: "",
};

// ---------- content (plain-language guide written for this book club; not a translation of the book) ----------
const INTRO = {
  id: "intro", title: "怎么用这份讲义",
  blocks: [
    { p: "这是一份读书会讲义：用小学五年级就能看懂的话，讲卡罗尔·德韦克《终身成长》（英文书名 Mindset: The New Psychology of Success）里最有用的想法，每章配一个生活例子和一个这周就能做的小练习。它不是原书的翻译，想读原文的朋友可以找中文版《终身成长》。" },
    { p: "作者是美国斯坦福大学的心理学教授，研究了几十年人为什么会放弃、为什么能坚持。她发现，人心里有两种看法：一种觉得本事是天生的、定死的；一种觉得本事是可以练出来的。哪一种占上风，会影响你上学、工作、恋爱、带孩子的方方面面。" },
    { p: "每章都分四块，读一章大约5分钟：" },
    { ol: ["一句话：这一章最重要的想法。", "大白话：用简单的话把它讲清楚。", "生活里的例子：放到工作和生活里，它是什么样子。", "这周试一试：一个小练习，做完打个勾。"] },
    { p: "全书一共8章，建议一周读一章，读完和朋友聊10分钟。不用全部看懂，能用上一个想法就是收获。" },
    { p: "看不懂的地方，用手指按住文字选中它，点下面的“对这段提问”，写下你的问题。所有问题都在右上角“我的问题”里，可以一键复制发给作者。" },
  ],
};

const CHAPTERS = [
  { n: "第1章", t: "两种想法",
    one: "觉得本事是天生定死的，还是能练出来的，会让人走上两条不同的路。",
    plain: [
      { p: "作者把第一种叫“固定型思维”：我聪明就是聪明，笨就是笨，改不了。第二种叫“成长型思维”：本事是练出来的，现在不会，不代表以后不会。" },
      { p: "她早年给孩子们做越来越难的拼图。有的孩子一遇到难的就泄气，觉得自己不行；有的孩子反而很兴奋，说“我喜欢有挑战的”。对后一种孩子来说，失败不是丢人，是在学东西。" },
    ],
    ex: "同样考电工证没考过，一个人说“我就不是读书的料”，从此不碰了；另一个人说“这次是哪几道题没会？下次重点练”，第二年考过了。",
    task: "写下一件你觉得“我天生就不行”的事，再用“我现在还不会……”重新写一遍。" },
  { n: "第2章", t: "两种想法，两种活法",
    one: "固定型的人忙着证明自己，成长型的人忙着让自己变好。",
    plain: [{ p: "固定型思维的人，总想证明自己聪明、有本事，所以爱挑简单的事做，怕失败，觉得“要努力”说明自己不够好。一次失败，他会觉得“我就是个失败的人”。成长型思维的人，把失败看成一件事没做好，不是自己这个人不行；努力在他看来正是变强的办法。" }],
    ex: "手游卡在一关打不过。一种人说“这游戏有问题”，摔手机不玩了；另一种人去看别人怎么打，研究对手的套路，一次次试，最后过了还特别有成就感。",
    task: "这周遇到一次失败或被批评时，把“我真没用”换成“这件事这次没做好，下次可以……”，写下来。" },
  { n: "第3章", t: "本事和成就是怎么来的",
    one: "夸孩子聪明会让他怕难，夸他努力和方法会让他敢挑战。",
    plain: [{ p: "作者做过一个有名的实验：给孩子做题，做完一半孩子被夸“你真聪明”，另一半被夸“你真努力”。接下来让他们自己选题，被夸聪明的多数选简单的，怕出错丢面子；被夸努力的多数选难的，想学新东西。后来遇到难题，被夸聪明的孩子更容易泄气，有些人甚至谎报了自己的分数。" }],
    ex: "孩子拼完一套很难的乐高，比起“你真聪明”，不如说“你一块块对着图纸找，错了还拆了重拼，真有耐心”。他记住的是：耐心和方法能让难事变成。",
    task: "这周夸人（孩子、同事、学员）时，至少有一次夸他的努力、方法或进步，而不是夸“聪明”“天赋”。" },
  { n: "第4章", t: "冠军是怎么炼成的",
    one: "真正的冠军靠的不只是天赋，而是不断学习、从失败里爬起来。",
    plain: [{ p: "很多人以为运动员靠天生的身体。作者举了很多例子：篮球明星乔丹高中时没进学校篮球校队，后来靠拼命练成了传奇。有天赋却以为“自己天生就行”的人，往往不肯苦练，遇到挫折就垮了。成长型的运动员把每场输球都当成上课：哪里不行，就练哪里。" }],
    ex: "健身房里，有人说“我天生胖，练也没用”，有人每周记录体重和动作，一点点调整。半年后，差别一眼就看得出来。",
    task: "选一个你想练的身体本事（骑车距离、俯卧撑个数、跳绳），这周记下第一天的成绩，周末再测一次。" },
  { n: "第5章", t: "老板和团队",
    one: "需要显得自己最厉害的老板，会把团队带进死胡同。",
    plain: [{ p: "作者研究了一些公司：有的老板一心要证明自己最聪明，听不得坏消息，身边只留说好话的人，最后公司出了大问题。成长型的老板愿意听真话、承认错误、培养手下的人，公司反而越做越好。" }],
    ex: "餐厅主厨听不得任何意见，服务员发现客人总剩某道菜也不敢说，结果生意越来越差。另一家的店长每周问员工“客人最近抱怨什么”，菜单改得越来越受欢迎。",
    task: "这周主动问一个同事或朋友：“我有哪件事可以做得更好？”只听，不解释，记下他说的。" },
  { n: "第6章", t: "感情里的两种想法",
    one: "好的感情不是天生合适，而是两个人愿意一起解决问题。",
    plain: [{ p: "固定型思维的人觉得：真正合适的两个人，不用努力就会好好的；一吵架就说明“选错了人”，或者“他这人就是有问题”。成长型思维的人知道：每段关系都有矛盾，矛盾是要一起学着解决的事，而不是给对方贴标签。这个道理放在朋友、家人之间也一样。" }],
    ex: "两口子为了谁做家务吵架。“你就是懒”是在给人定性；“这周你下班晚，我们重新分一下谁做什么吧”，是在一起想办法。",
    task: "下次和家人有小矛盾时，把一句“你总是……”换成“我们下次可以……”说出来。" },
  { n: "第7章", t: "父母、老师和教练",
    one: "大人说的话会悄悄告诉孩子：本事是定死的，还是能长的。",
    plain: [{ p: "父母、老师、教练的一句话，孩子会记很久。“你真聪明”“你就是不行”，都是在说“本事是定死的”。好老师和好教练相信每个人都能进步，要求很高，但会教方法、陪着练。批评也可以是成长型的：说清楚哪里没做好，下次怎么改，而不是说“你怎么这么笨”。" }],
    ex: "教孩子骑自行车，他摔了好几次想放弃。比起“你怎么这么笨”，不如说“刚才你骑出去三米了，比第一次远多了，眼睛看前面再试一次”。训练小狗也一样，做对一点就奖励，耐心比骂管用。",
    task: "回想一句你小时候被大人说过、到现在还记得的话，写下它让你相信了什么。" },
  { n: "第8章", t: "怎么换一种想法",
    one: "每个人都同时有两种想法，可以练习听出固定型的声音，再回它一句。",
    plain: [
      { p: "作者说，没有人百分之百是成长型的，每个人心里都住着两种声音。改变可以分四步：" },
      { ol: ["听出它：心里冒出“我不行”“别丢人了”的时候，认出这是固定型的声音。", "知道自己能选：你可以不听它的。", "回它一句：用成长型的话回答，比如“我还没学会，可以学”。", "去做：真的去试一次、问一次、练一次。"] },
      { p: "作者还提醒：成长型思维不只是“多努力”，还要换方法、找人帮忙。光埋头苦干、方法不对，也不会进步。" },
    ],
    ex: "戒烟失败又抽了一根，心里说“我就是戒不掉”。回它一句：“这次坚持了五天，比上次多三天。是下班那一阵最难熬，那就换个办法过那半小时。”",
    task: "给你心里那个“我不行”的声音起个名字，这周它出来一次，就用四步回它一次，记下来。" },
];

const CLUB = {
  id: "club", title: "读书会怎么开",
  blocks: [
    { p: "每周一次，每次30分钟，当面或视频都可以。人不用多，两三个就够。" },
    { ol: ["先聊上周（5分钟）：上周的“试一试”做了没有？发生了什么？", "一起读（10分钟）：轮流读这周这一章。", "聊三个问题（10分钟）：这一章哪句话你最同意？哪句不同意？你什么时候是固定型、什么时候是成长型？如果只能用上一个想法，你选哪个？", "定下周的小行动（5分钟）：每个人说出自己这周要试的一件事。"] },
    { p: "小提醒：只问问题、不讲大道理；说错了、做不到都没关系，“还没做到”不等于“做不到”；这不是考试，是朋友一起变好的时间。" },
  ],
};
CHAPTERS.forEach((c, i) => { c.id = "c" + (i + 1); });
const PAGES = [INTRO, ...CHAPTERS, CLUB];
const pageIdx = (id) => PAGES.findIndex((p) => p.id === id);
const pageName = (p) => p.n ? `${p.n}　${p.t}` : p.title;

// ---------- reader data, kept only on this phone ----------
const KEY = "mindset-bookclub-v1";
let state = { notes: [], tasks: {}, level: {}, name: "", last: "intro" };
try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
if (!state.reader) state.reader = "r" + Math.random().toString(36).slice(2, 10);
// With CONFIG.feedbackUrl set, every save is also sent to the organizer (batched a few seconds), so readers don't have to send anything.
let syncTimer = null;
function autoSend() {
  if (!CONFIG.feedbackUrl) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    fetch(CONFIG.feedbackUrl, { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
      body: JSON.stringify({ reader: state.reader, name: state.name, notes: state.notes, level: state.level, tasks: state.tasks, text: feedbackText(), at: new Date().toISOString() }) })
      .then((r) => { state.sentAt = r.ok ? new Date().toISOString() : state.sentAt; persist(); })
      .catch(() => {});
  }, 3000);
}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const save = () => { persist(); autoSend(); };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let pidSeq = 0;
const para = (cls, html) => `<p data-pid="${pidSeq++}"${cls ? ` class="${cls}"` : ""}>${html}</p>`;
function blocksHTML(blocks) {
  return blocks.map((b) => {
    if (b.p) return para("", esc(b.p));
    const tag = b.ol ? "ol" : "ul";
    return `<${tag}>${(b.ol || b.ul).map((x) => `<li data-pid="${pidSeq++}">${esc(x)}</li>`).join("")}</${tag}>`;
  }).join("");
}

// ---------- views ----------
const LEVELS = ["都看懂了", "有一点难", "很多看不懂"];
function renderPage(id) {
  const i = Math.max(0, pageIdx(id));
  const pg = PAGES[i];
  state.last = pg.id; persist();
  pidSeq = 0;
  let body;
  if (pg.n) {
    body = `<p class="kicker">${esc(pg.n)}</p><h1>${esc(pg.t)}</h1>
      <h2 class="lbl">一句话</h2>${para("one", esc(pg.one))}
      <h2 class="lbl">大白话</h2>${blocksHTML(pg.plain)}
      <h2 class="lbl">生活里的例子</h2>${para("example", esc(pg.ex))}
      <h2 class="lbl">这周试一试</h2>
      <label class="task"><input type="checkbox" id="taskBox" ${state.tasks[pg.id] ? "checked" : ""}><span data-pid="${pidSeq++}">${esc(pg.task)}</span></label>
      <div class="check"><p>这一章你看懂了吗？（作者会根据大家的回答改进讲义）</p>
        <div class="choices">${LEVELS.map((l, k) => `<button class="choice" data-level="${k}" aria-pressed="${state.level[pg.id] === k}">${l}</button>`).join("")}</div>
        <p class="hint" style="margin-top:10px">哪里看不懂？按住文字选中它，点“对这段提问”。</p>
      </div>`;
  } else {
    body = `<h1>${esc(pg.title)}</h1>${blocksHTML(pg.blocks)}`;
  }
  const prev = PAGES[i - 1], next = PAGES[i + 1];
  $("#view").innerHTML = `<article id="art" data-page="${pg.id}">${body}</article>
    <div class="pager">
      <button class="pbtn" id="prevBtn" ${prev ? "" : "hidden"}><small>上一篇</small>${prev ? esc(pageName(prev)) : ""}</button>
      <button class="pbtn next" id="nextBtn" ${next ? "" : "hidden"}><small>下一篇</small>${next ? esc(pageName(next)) : ""}</button>
    </div>`;
  if (prev) $("#prevBtn").onclick = () => go(prev.id);
  if (next) $("#nextBtn").onclick = () => go(next.id);
  const tb = $("#taskBox");
  if (tb) tb.onchange = () => { state.tasks[pg.id] = tb.checked; save(); };
  document.querySelectorAll("[data-level]").forEach((b) => b.onclick = () => {
    const k = Number(b.dataset.level);
    state.level[pg.id] = state.level[pg.id] === k ? undefined : k; save();
    document.querySelectorAll("[data-level]").forEach((x) => x.setAttribute("aria-pressed", String(state.level[pg.id] === Number(x.dataset.level))));
    if (k > 0 && state.level[pg.id] === k) toast("谢谢！可以选中看不懂的文字提个问题。");
  });
  applyHighlights(pg.id);
  window.scrollTo(0, 0);
}
function renderToc() {
  $("#view").innerHTML = `<article><h1>目录</h1><nav class="toc">${PAGES.map((p) => {
    const n = state.notes.filter((x) => x.page === p.id).length;
    const meta = [state.tasks[p.id] ? "已练习" : "", n ? `${n}个问题` : ""].filter(Boolean).join(" · ");
    return `<a href="#${p.id}" data-go="${p.id}"><span>${esc(pageName(p))}</span><span class="meta">${meta}</span></a>`;
  }).join("")}</nav></article>`;
  window.scrollTo(0, 0);
}
// Navigation is driven by the page itself; the #hash is only kept in sync where the browser allows it
// (some in-app viewers block hash changes, which broke the contents and previous/next buttons).
let current = (() => { try { return location.hash.slice(1); } catch (e) { return ""; } })() || state.last;
function go(id) {
  current = id;
  route();
  try { if (location.hash.slice(1) !== id) history.pushState(null, "", "#" + id); } catch (e) {}
}
function route() {
  if (current === "toc") renderToc();
  else renderPage(pageIdx(current) >= 0 ? current : state.last);
  $("#myCount").textContent = state.notes.length;
}
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && id !== current) { current = id; route(); } });
window.addEventListener("popstate", () => { const id = location.hash.slice(1) || state.last; if (id !== current) { current = id; route(); } });
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-go]");
  if (!a) return;
  e.preventDefault();
  closeSheet();
  go(a.dataset.go);
});
$("#tocBtn").onclick = () => go("toc");
$("#myBtn").onclick = openMine;

// ---------- highlights ----------
function textNodes(el) {
  const out = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  while (w.nextNode()) out.push(w.currentNode);
  return out;
}
function wrapText(el, text, noteId) {
  const nodes = textNodes(el);
  const full = nodes.map((n) => n.nodeValue).join("");
  const start = full.indexOf(text);
  if (start < 0 || !text) return;
  const end = start + text.length;
  let pos = 0;
  nodes.forEach((n) => {
    const a = pos, b = pos + n.nodeValue.length;
    pos = b;
    const s = Math.max(start, a), e = Math.min(end, b);
    if (s >= e) return;
    const r = document.createRange();
    r.setStart(n, s - a); r.setEnd(n, e - a);
    const m = document.createElement("mark");
    m.className = "hl"; m.dataset.note = noteId;
    r.surroundContents(m);
  });
}
function applyHighlights(page) {
  state.notes.filter((x) => x.page === page).forEach((x) => {
    const el = document.querySelector(`#art [data-pid="${x.pid}"]`);
    if (el) wrapText(el, x.text, x.id);
  });
}
document.addEventListener("click", (e) => {
  const m = e.target.closest("mark.hl");
  if (m && !hasSelection()) { e.preventDefault(); openNote(state.notes.find((x) => x.id === m.dataset.note)); }
});

// ---------- selecting text to ask ----------
let pending = null;
function hasSelection() { const s = window.getSelection(); return s && !s.isCollapsed && s.toString().trim().length > 0; }
function readSelection() {
  const s = window.getSelection();
  if (!s || s.isCollapsed) return null;
  const text = s.toString().replace(/\s+/g, " ").trim();
  if (!text) return null;
  const node = (n) => (n.nodeType === 1 ? n : n.parentElement);
  const a = node(s.anchorNode)?.closest("[data-pid]"), b = node(s.focusNode)?.closest("[data-pid]");
  const art = $("#art");
  if (!art || !a || !art.contains(a)) return null;
  // A selection across paragraphs is kept as the part inside the first one.
  const el = a;
  const inEl = a === b ? text : (el.textContent.includes(text) ? text : text.slice(0, 60));
  return { page: art.dataset.page, pid: Number(el.dataset.pid), text: el.textContent.includes(inEl) ? inEl : el.textContent.slice(0, 60) };
}
document.addEventListener("selectionchange", () => {
  const sel = readSelection();
  pending = sel;
  $("#selbar").hidden = !sel;
  $("#fab").hidden = !!sel;
});
$("#askBtn").addEventListener("mousedown", (e) => e.preventDefault());
$("#askBtn").onclick = () => {
  const sel = pending || readSelection();
  if (!sel) return;
  window.getSelection().removeAllRanges();
  $("#selbar").hidden = true; $("#fab").hidden = false;
  openNote(null, sel);
};
$("#fab").onclick = () => {
  const art = $("#art");
  openNote(null, { page: art ? art.dataset.page : "intro", pid: -1, text: "" });
};

// ---------- sheets ----------
function sheet(html) {
  const root = $("#sheetRoot");
  root.innerHTML = `<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#sbg").addEventListener("click", (e) => { if (e.target.id === "sbg") closeSheet(); });
  return root;
}
function closeSheet() { $("#sheetRoot").innerHTML = ""; }
function openNote(note, sel) {
  const isNew = !note;
  const data = note || { id: "n" + Date.now().toString(36), page: sel.page, pid: sel.pid, text: sel.text, q: "", at: new Date().toISOString() };
  const pg = PAGES[pageIdx(data.page)];
  sheet(`<h3>${isNew ? "提一个问题" : "我的问题"}</h3>
    <p class="hint">${esc(pageName(pg))}</p>
    ${data.text ? `<p class="quote">${esc(data.text)}</p>` : ""}
    <textarea id="qBox" placeholder="哪里看不懂？或者你想到了什么？随便写，写一半也行。">${esc(data.q)}</textarea>
    <div class="row">
      <button class="btn" id="saveQ">保存</button>
      <button class="btn ghost" id="cancelQ">取消</button>
      ${isNew ? "" : `<button class="btn danger" id="delQ">删除</button>`}
    </div>`);
  const box = $("#qBox");
  setTimeout(() => box.focus(), 50);
  $("#cancelQ").onclick = closeSheet;
  $("#saveQ").onclick = () => {
    data.q = box.value.trim();
    if (!data.q && !data.text) { closeSheet(); return; }
    if (isNew) state.notes.push(data);
    save(); closeSheet(); route();
    toast("已保存。在“我的问题”里可以发给作者。");
  };
  if (!isNew) $("#delQ").onclick = () => { state.notes = state.notes.filter((x) => x.id !== data.id); save(); closeSheet(); route(); };
}

// ---------- my questions + send to the author ----------
function feedbackText() {
  const lines = [`《终身成长》读书会简明版 · 读者反馈`, `读者：${state.name || "（没留名字）"}`, ""];
  PAGES.forEach((p) => {
    const notes = state.notes.filter((x) => x.page === p.id);
    const lvl = state.level[p.id];
    if (!notes.length && lvl === undefined && !state.tasks[p.id]) return;
    lines.push(`【${pageName(p)}】`);
    if (lvl !== undefined) lines.push(`看懂了吗：${LEVELS[lvl]}`);
    if (state.tasks[p.id]) lines.push(`这周试一试：做了`);
    notes.forEach((x) => {
      if (x.text) lines.push(`· 划线：「${x.text}」`);
      lines.push(`  问题：${x.q || "（没写问题）"}`);
    });
    lines.push("");
  });
  return lines.join("\n").trim();
}
function openMine() {
  const notes = state.notes;
  sheet(`<h3>我的问题（${notes.length}）</h3>
    ${notes.length ? notes.map((x) => {
      const p = PAGES[pageIdx(x.page)];
      return `<div class="note"><a href="#${x.page}" data-go="${x.page}">${esc(pageName(p))}</a>${x.text ? `<p class="quote" style="margin:4px 0 0">${esc(x.text)}</p>` : ""}<p class="q">${esc(x.q || "（没写问题）")}</p></div>`;
    }).join("") : `<p class="hint">还没有问题。读的时候按住文字选中，点“对这段提问”。</p>`}
    <h3 style="margin-top:18px">发给作者</h3>
    <p class="hint">${CONFIG.feedbackUrl ? "你的问题保存后会自动发给作者，不用再做什么。下面的按钮可以再发一份到微信。" : esc(CONFIG.sendTo)}</p>
    <input type="text" id="nameBox" placeholder="你的名字或昵称（可以不填）" value="${esc(state.name)}">
    <div class="row">
      <button class="btn" id="sendBtn">复制，去微信发送</button>
      ${navigator.share ? `<button class="btn ghost" id="shareBtn">用其他方式分享</button>` : ""}
      <button class="btn ghost" id="closeMine">关闭</button>
    </div>
    <textarea id="fbText" readonly style="margin-top:12px;min-height:140px" aria-label="要发送的内容"></textarea>
    <p class="hint">复制不成功的话，可以长按上面的文字全选复制。</p>`);
  const fb = $("#fbText");
  const refresh = () => { state.name = $("#nameBox").value.trim(); save(); fb.value = feedbackText(); };
  refresh();
  $("#nameBox").oninput = refresh;
  $("#closeMine").onclick = closeSheet;
  $("#sendBtn").onclick = async () => {
    refresh();
    if (CONFIG.feedbackUrl) {
      try { await fetch(CONFIG.feedbackUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: state.name, text: fb.value, notes: state.notes, level: state.level, tasks: state.tasks }) }); toast("已发送，谢谢！"); return; } catch (e) {}
    }
    if (await copy(fb.value)) toast("已复制，打开微信粘贴发送就行。");
    else { fb.focus(); fb.select(); toast("请长按文字，选“全选”再复制。"); }
  };
  const sb = $("#shareBtn");
  if (sb) sb.onclick = () => { refresh(); navigator.share({ title: "读书会反馈", text: fb.value }).catch(() => {}); };
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy"); t.remove(); return ok;
  } catch (e) { return false; }
}
let toastTimer;
function toast(msg) {
  let t = $(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}

route();

// ---------- install as a home-screen app ----------
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
(function installHint() {
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (standalone || state.hideInstall) return;
  const ua = navigator.userAgent;
  let how;
  if (/MicroMessenger/i.test(ua)) how = "点右上角“⋯”，选“在浏览器打开”，再把它添加到主屏幕。";
  else if (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) how = "点下方的“分享”按钮，选“添加到主屏幕”。";
  else if (/Android/i.test(ua)) how = "点浏览器菜单“⋮”，选“添加到主屏幕”或“安装应用”。";
  else return;
  const bar = document.createElement("div");
  bar.className = "install";
  bar.innerHTML = `<span><b>放到手机桌面，像App一样打开：</b>${how}</span><button aria-label="关闭">知道了</button>`;
  const box = document.createElement("div");
  box.className = "wrap"; box.style.paddingTop = "16px";
  box.appendChild(bar);
  bar.querySelector("button").onclick = () => { state.hideInstall = true; persist(); box.remove(); };
  document.querySelector("main").prepend(box);
})();
</script>
</body>
</html>
